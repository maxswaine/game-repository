name: CI

on:
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-test-secret-key-not-used-in-production' }}
          DATABASE_URL: sqlite:///./test.db
        run: pytest tests/ -v --tb=short

      - name: Check version file exists
        run: test -f VERSION && echo "Version $(cat VERSION)"
